services:
  r1:
    image: quay.io/frrouting/frr:9.1.0
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./topology/r1/daemons:/etc/frr/daemons:ro
      - ./topology/r1/frr.conf:/etc/frr/frr.conf:ro
      - ./topology/r1/vtysh.conf:/etc/frr/vtysh.conf:ro
    networks:
      net_a:
        ipv4_address: 172.21.0.3
        interface_name: eth0
      net_b:
        ipv4_address: 172.20.0.3
        interface_name: eth1

  r2:
    image: quay.io/frrouting/frr:9.1.0
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./topology/r2/daemons:/etc/frr/daemons:ro
      - ./topology/r2/frr.conf:/etc/frr/frr.conf:ro
      - ./topology/r2/vtysh.conf:/etc/frr/vtysh.conf:ro
    networks:
      net_b:
        ipv4_address: 172.20.0.2
        interface_name: eth0
      net_c:
        ipv4_address: 172.19.0.2
        interface_name: eth1

  r3:
    image: quay.io/frrouting/frr:9.1.0
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./topology/r3/daemons:/etc/frr/daemons:ro
      - ./topology/r3/frr.conf:/etc/frr/frr.conf:ro
      - ./topology/r3/vtysh.conf:/etc/frr/vtysh.conf:ro
    networks:
      net_c:
        ipv4_address: 172.19.0.3
        interface_name: eth0
      net_a:
        ipv4_address: 172.21.0.2
        interface_name: eth1

networks:
  net_a:
    ipam:
      config:
        - subnet: 172.21.0.0/16
  net_b:
    ipam:
      config:
        - subnet: 172.20.0.0/16
  net_c:
    ipam:
      config:
        - subnet: 172.19.0.0/16
